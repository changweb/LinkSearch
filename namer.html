<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คัดลอกชื่อไฟล์ (Real-time)</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0f9d58; --bg: #f8f9fa; --border: #e0e0e0; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }

        /* Header Area */
        .header-panel { background: white; padding: 20px; border-bottom: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.02); flex-shrink: 0; }
        .title-main { font-size: 20px; font-weight: bold; color: #202124; margin: 0 0 5px 0; display: flex; align-items: center; gap: 10px; }
        .date-badge { font-size: 14px; color: #5f6368; display: inline-flex; align-items: center; gap: 5px; background: #e8f0fe; color: #1a73e8; padding: 4px 10px; border-radius: 20px; margin-bottom: 15px; font-weight: bold; }
        
        /* Status Indicator */
        .live-status { font-size: 12px; color: #0f9d58; display: inline-flex; align-items: center; gap: 4px; font-weight: bold; margin-left: auto; }
        .pulse-dot { width: 8px; height: 8px; background: #0f9d58; border-radius: 50%; animation: pulse 1.5s infinite; }

        /* Controls */
        .controls-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        select { padding: 10px 15px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; width: 100%; max-width: 400px; cursor: pointer; outline: none; background: white; }
        select:focus { border-color: var(--primary); }

        /* Content Area */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .list-container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Data Row Card */
        .data-card { background: white; padding: 15px 20px; border-radius: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 20px; transition: all 0.2s; }
        .data-card:hover { border-color: #c0c0c0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        
        .info-block { flex: 1; }
        .agenda-text { font-size: 13px; color: #5f6368; font-weight: bold; margin-bottom: 4px; background: #f1f3f4; display: inline-block; padding: 2px 8px; border-radius: 4px; }
        .filename-text { font-size: 15px; font-weight: bold; color: #202124; word-break: break-all; }

        /* Buttons */
        .btn-copy { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; flex-shrink: 0; transition: background 0.2s; }
        .btn-copy:hover { background: #0b8043; }
        .btn-copy.copied { background: #1a73e8; }

        .no-data { text-align: center; color: #888; padding: 40px; font-size: 16px; }
        
        /* Loading Screen */
        #loading { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; color: #666; font-weight: bold; gap: 10px; }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(15, 157, 88, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(15, 157, 88, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(15, 157, 88, 0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body>

<div id="loading">
    <i data-lucide="loader-2" class="spin" style="width: 32px; height: 32px; color: var(--primary);"></i>
    <span>กำลังเชื่อมต่อระบบฐานข้อมูลเรียลไทม์...</span>
</div>

<div class="header-panel">
    <div class="title-main"><i data-lucide="video" style="color:var(--primary)"></i> คัดลอกชื่อไฟล์</div>
    <div class="date-badge" id="meeting-date-display"><i data-lucide="calendar" style="width:14px;"></i> การประชุมวันที่: -</div>
    
    <div class="controls-row">
        <select id="agendaFilter" onchange="filterData()">
            <option value="all">-- แสดงทุกวาระการประชุม --</option>
        </select>
        <div class="live-status">
            <div class="pulse-dot"></div>
            <span>ฐานข้อมูลเชื่อมต่อเรียลไทม์</span>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="list-container" id="data-list">
        <!-- ข้อมูลจะแสดงตรงนี้ -->
    </div>
</div>

<script>
    const secret = "AFZ2OqBiEJzlKKF8okPLi4mcj1VD4pa62EeWTndR";
    // ใช้คำสั่ง Streaming (SSE) ของ Firebase ด้วยการส่งผ่าน Header `text/event-stream` ในระดับเบื้องหลัง
    const firebaseUrl = "https://linksearch-84695-default-rtdb.asia-southeast1.firebasedatabase.app/NamingBot.json?auth=" + secret;

    let masterItems = [];

    window.onload = function() {
        lucide.createIcons();
        initRealtimeSync();
    };

    // ใช้ EventSource เปิดท่อส่งข้อมูลเรียลไทม์กับ Firebase
    function initRealtimeSync() {
        const eventSource = new EventSource(firebaseUrl);

        eventSource.addEventListener('put', function(e) {
            document.getElementById('loading').style.display = 'none';
            try {
                const packet = JSON.parse(e.data);
                const data = packet.data;

                if (!data) {
                    document.getElementById('data-list').innerHTML = '<div class="no-data">ไม่พบข้อมูลชื่อไฟล์ในระบบในขณะนี้</div>';
                    return;
                }

                // แสดงวันที่ประชุม (ค่าจาก C2)
                document.getElementById('meeting-date-display').innerHTML = `<i data-lucide="calendar" style="width:14px;"></i> การประชุมวันที่: ${data.meetingDate || '-'}`;

                // นำข้อมูลมากลับด้าน (Reverse) เพื่อเรียงลำดับจาก ใหม่ไปเก่า
                const rawItems = data.items || [];
                masterItems = [...rawItems].reverse(); 
                
                // อัปเดต Dropdown วาระการประชุม (คงค่าที่เลือกไว้ก่อนหน้าถ้ามี)
                const uniqueAgendas = [...new Set(rawItems.map(item => item.agenda))].filter(a => a !== "");
                const filterSelect = document.getElementById('agendaFilter');
                const currentSelection = filterSelect.value;
                
                filterSelect.innerHTML = '<option value="all">-- แสดงทุกวาระการประชุม --</option>' + 
                    uniqueAgendas.map(a => `<option value="${a}">${a}</option>`).join('');

                if(uniqueAgendas.includes(currentSelection)) {
                    filterSelect.value = currentSelection;
                }

                // ทำการแสดงผลรายชื่อ
                filterData();

            } catch (err) {
                console.error("Error processing real-time stream:", err);
            }
        });

        eventSource.onerror = function(err) {
            console.error("EventSource failed:", err);
            // กรณีระบบหลุด จะพยายามต่อสัญญาณให้ใหม่อัตโนมัติ
        };
    }

    function renderList(items) {
        const container = document.getElementById('data-list');
        if (items.length === 0) {
            container.innerHTML = '<div class="no-data">ไม่พบรายชื่อไฟล์ในวาระนี้</div>';
            return;
        }

        container.innerHTML = items.map((item, index) => `
            <div class="data-card">
                <div class="info-block">
                    <span class="agenda-text">${item.agenda}</span>
                    <div class="filename-text" id="name-${index}">${item.fileName}</div>
                </div>
                <button class="btn-copy" onclick="copyText('${item.fileName.replace(/'/g, "\\'")}', this)">
                    <i data-lucide="copy" style="width:16px;"></i> คัดลอกชื่อไฟล์
                </button>
            </div>
        `).join('');
        lucide.createIcons();
    }

    function filterData() {
        const selectedAgenda = document.getElementById('agendaFilter').value;
        if (selectedAgenda === 'all') {
            renderList(masterItems);
        } else {
            const filtered = masterItems.filter(item => item.agenda === selectedAgenda);
            renderList(filtered);
        }
    }

    function copyText(text, buttonElement) {
        navigator.clipboard.writeText(text).then(() => {
            const originalHTML = buttonElement.innerHTML;
            buttonElement.classList.add('copied');
            buttonElement.innerHTML = '<i data-lucide="check" style="width:16px;"></i> คัดลอกแล้ว!';
            lucide.createIcons();
            
            setTimeout(() => {
                buttonElement.classList.remove('copied');
                buttonElement.innerHTML = originalHTML;
                lucide.createIcons();
            }, 1500);
        });
    }
</script>
</body>
</html>
