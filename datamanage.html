<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการฐานข้อมูล (Admin Dashboard)</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #1a73e8; --danger: #dc3545; --bg: #f8f9fa; --border: #e0e0e0; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; color: #202124; }
        
        .controls { display: flex; gap: 15px; }
        select, input { padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 15px; outline: none; }
        select:focus, input:focus { border-color: var(--primary); }
        
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f1f3f4; font-weight: bold; color: #5f6368; }
        tr:hover { background: #f8f9fa; }
        
        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; color: white; transition: 0.2s; }
        .btn-edit { background: #fbbc04; color: #000; }
        .btn-edit:hover { background: #f2a500; }
        .btn-delete { background: var(--danger); }
        .btn-delete:hover { background: #c82333; }
        .btn-save { background: var(--primary); font-size: 15px; padding: 10px 20px; }
        .btn-cancel { background: #6c757d; font-size: 15px; padding: 10px 20px; }

        /* Modal / Popup */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal h2 { margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }

        #loading { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; color: var(--primary); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body>

<div id="loading">
    <i data-lucide="loader-2" class="spin" style="width: 40px; height: 40px; margin-bottom: 10px;"></i>
    <span>กำลังโหลดฐานข้อมูล กรุณารอสักครู่...</span>
</div>

<div class="header">
    <h1><i data-lucide="database"></i> ระบบจัดการฐานข้อมูล PublicSearch</h1>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อไฟล์..." onkeyup="filterData()">
        
        <!-- ระบบฟิลเตอร์ 3 ชั้น -->
        <select id="yearFilter" onchange="updateMonthOptions(); filterData()">
            <option value="all">-- ทุกปี --</option>
        </select>
        <select id="monthFilter" onchange="updateDayOptions(); filterData()">
            <option value="all">-- ทุกเดือน --</option>
        </select>
        <select id="dayFilter" onchange="filterData()">
            <option value="all">-- ทุกวัน --</option>
        </select>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th style="width: 15%;">วันที่ (Date)</th>
            <th style="width: 40%;">ชื่อไฟล์ (Link Name)</th>
            <th style="width: 25%;">วิดีโอลิงก์ (Video Link)</th>
            <th style="width: 20%; text-align: center;">จัดการ</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <!-- ข้อมูลตารางจะถูกแทรกที่นี่ -->
    </tbody>
</table>

<!-- Popup สำหรับแก้ไขข้อมูล -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2><i data-lucide="edit"></i> แก้ไขข้อมูล</h2>
        <input type="hidden" id="edit-original-key">
        
        <div class="form-group">
            <label>ชื่อไฟล์ (Link Name)</label>
            <input type="text" id="edit-linkname">
        </div>
        <div class="form-group">
            <label>ลิงก์ Google Drive</label>
            <input type="text" id="edit-link">
        </div>
        <div class="form-group">
            <label>วันที่อภิปราย</label>
            <input type="text" id="edit-date" placeholder="เช่น 2026-07-08T17:00:00.000Z">
        </div>
        
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
            <button class="btn btn-save" onclick="saveData()"><i data-lucide="save"></i> บันทึกข้อมูล</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ ถ้าพี่เปลี่ยนชื่อโฟลเดอร์ PublicSearch เป็นชื่ออื่น อย่าลืมแก้ตรงนี้นะครับ
    const secret = "AFZ2OqBiEJzlKKF8okPLi4mcj1VD4pa62EeWTndR";
    const firebaseUrlBase = "https://linksearch-84695-default-rtdb.asia-southeast1.firebasedatabase.app/MixLinks"; 
    
    let rawData = {};
    let dataArray = [];

    window.onload = function() {
        lucide.createIcons();
        fetchDatabase();
    };

    // 1. ดึงข้อมูลทั้งหมดจาก Firebase
    async function fetchDatabase() {
        try {
            const response = await fetch(`${firebaseUrlBase}.json?auth=${secret}`);
            rawData = await response.json() || {};
            
            dataArray = Object.keys(rawData).map(key => ({
                id: key, 
                ...rawData[key]
            }));

            // เรียงลำดับจากใหม่สุดไปเก่าสุด
            dataArray.sort((a, b) => new Date(b.date) - new Date(a.date));

            // เรียกใช้งานฟังก์ชันสร้าง Dropdown ปี
            populateYearOptions(); 
            filterData();
            
            document.getElementById('loading').style.display = 'none';
        } catch (error) {
            console.error("Error fetching data:", error);
            alert("เกิดข้อผิดพลาดในการโหลดข้อมูล!");
        }
    }

    // ==========================================
    // ระบบสร้าง Dropdown แบบลดหลั่น (Cascading)
    // ==========================================
    
    function getThaiMonth(monthIndex) {
        const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        return thaiMonths[monthIndex];
    }

    function populateYearOptions() {
        const yearSelect = document.getElementById('yearFilter');
        const uniqueYears = new Set();

        dataArray.forEach(item => {
            if (item.date) {
                let d = new Date(item.date);
                if (!isNaN(d)) {
                    uniqueYears.add(d.toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" }).split('-')[0]);
                }
            }
        });

        const sortedYears = Array.from(uniqueYears).sort().reverse();
        let optionsHtml = '<option value="all">-- ทุกปี --</option>';
        sortedYears.forEach(year => {
            optionsHtml += `<option value="${year}">${Number(year) + 543}</option>`; 
        });
        yearSelect.innerHTML = optionsHtml;
        
        updateMonthOptions(); 
    }

    function updateMonthOptions() {
        const yearFilter = document.getElementById('yearFilter').value;
        const monthSelect = document.getElementById('monthFilter');
        const uniqueMonths = new Set();

        dataArray.forEach(item => {
            if (item.date) {
                let d = new Date(item.date);
                if (!isNaN(d)) {
                    let parts = d.toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" }).split('-');
                    if (yearFilter === 'all' || parts[0] === yearFilter) {
                        uniqueMonths.add(parts[1]);
                    }
                }
            }
        });

        const sortedMonths = Array.from(uniqueMonths).sort();
        let optionsHtml = '<option value="all">-- ทุกเดือน --</option>';
        sortedMonths.forEach(month => {
            optionsHtml += `<option value="${month}">${getThaiMonth(parseInt(month) - 1)}</option>`;
        });
        monthSelect.innerHTML = optionsHtml;
        
        document.getElementById('dayFilter').value = 'all';
        updateDayOptions(); 
    }

    function updateDayOptions() {
        const yearFilter = document.getElementById('yearFilter').value;
        const monthFilter = document.getElementById('monthFilter').value;
        const daySelect = document.getElementById('dayFilter');
        const uniqueDays = new Set();

        dataArray.forEach(item => {
            if (item.date) {
                let d = new Date(item.date);
                if (!isNaN(d)) {
                    let parts = d.toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" }).split('-');
                    let matchYear = (yearFilter === 'all' || parts[0] === yearFilter);
                    let matchMonth = (monthFilter === 'all' || parts[1] === monthFilter);
                    
                    if (matchYear && matchMonth) {
                        uniqueDays.add(parts[2]);
                    }
                }
            }
        });

        const sortedDays = Array.from(uniqueDays).sort((a,b) => parseInt(a) - parseInt(b));
        let optionsHtml = '<option value="all">-- ทุกวัน --</option>';
        sortedDays.forEach(day => {
            optionsHtml += `<option value="${day}">${parseInt(day)}</option>`; 
        });
        daySelect.innerHTML = optionsHtml;
    }

    // ==========================================
    // กรองและแสดงผลข้อมูลตาราง
    // ==========================================

    function filterData() {
        const yearFilter = document.getElementById('yearFilter').value;
        const monthFilter = document.getElementById('monthFilter').value;
        const dayFilter = document.getElementById('dayFilter').value;
        const searchTxt = document.getElementById('searchInput').value.toLowerCase();
        
        let filtered = dataArray;

        filtered = filtered.filter(item => {
            if(!item.date) return false;
            let d = new Date(item.date);
            if (isNaN(d)) return false;
            
            let parts = d.toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" }).split('-');
            
            let matchY = (yearFilter === 'all' || parts[0] === yearFilter);
            let matchM = (monthFilter === 'all' || parts[1] === monthFilter);
            let matchD = (dayFilter === 'all' || parts[2] === dayFilter);
            
            return matchY && matchM && matchD;
        });

        if (searchTxt !== '') {
            filtered = filtered.filter(item => 
                (item.linkname && item.linkname.toLowerCase().includes(searchTxt)) ||
                (item.link && item.link.toLowerCase().includes(searchTxt))
            );
        }

        renderTable(filtered);
    }

    function renderTable(items) {
        const tbody = document.getElementById('tableBody');
        
        if (items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px; color:#888;">ไม่พบข้อมูล</td></tr>';
            return;
        }

        tbody.innerHTML = items.map(item => {
            let displayDate = '-';
            if (item.date) {
                let d = new Date(item.date);
                displayDate = !isNaN(d) 
                    ? d.toLocaleDateString("th-TH", { timeZone: "Asia/Bangkok", year: 'numeric', month: 'short', day: 'numeric' }) 
                    : item.date.split('T')[0];
            }
            
            let displayLink = item.link && item.link.includes('http') ? `<a href="${item.link}" target="_blank" style="color:#1a73e8;">เปิดดูคลิป</a>` : item.link;

            return `
                <tr>
                    <td>${displayDate}</td>
                    <td style="font-weight:bold;">${item.linkname || '-'}</td>
                    <td>${displayLink}</td>
                    <td>
                        <button class="btn btn-edit" onclick="openModal('${item.id}')"><i data-lucide="edit" style="width:14px"></i> แก้ไข</button>
                        <button class="btn btn-delete" onclick="deleteData('${item.id}')"><i data-lucide="trash-2" style="width:14px"></i> ลบ</button>
                    </td>
                </tr>
            `;
        }).join('');
        
        lucide.createIcons();
    }

    // ==========================================
    // จัดการข้อมูล (ลบ / แก้ไข / บันทึก)
    // ==========================================

    async function deleteData(key) {
        if (confirm("⚠️ คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลนี้? (ลบแล้วกู้คืนไม่ได้)")) {
            document.getElementById('loading').style.display = 'flex';
            try {
                await fetch(`${firebaseUrlBase}/${encodeURIComponent(key)}.json?auth=${secret}`, {
                    method: 'DELETE'
                });
                fetchDatabase();
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการลบข้อมูล");
                document.getElementById('loading').style.display = 'none';
            }
        }
    }

    function openModal(key) {
        const item = rawData[key];
        document.getElementById('edit-original-key').value = key;
        document.getElementById('edit-linkname').value = item.linkname || '';
        document.getElementById('edit-link').value = item.link || '';
        document.getElementById('edit-date').value = item.date || '';
        
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function saveData() {
        const oldKey = document.getElementById('edit-original-key').value;
        const newLinkName = document.getElementById('edit-linkname').value.trim();
        const newLink = document.getElementById('edit-link').value.trim();
        const newDate = document.getElementById('edit-date').value.trim();
        
        if (!newLinkName) {
            alert("กรุณากรอกชื่อไฟล์!"); return;
        }

        document.getElementById('loading').style.display = 'flex';
        closeModal();

        const updatedData = {
            ...rawData[oldKey],
            linkname: newLinkName,
            link: newLink,
            date: newDate,
            spkdate: newDate
        };

        try {
            const safeNewKey = newLinkName.replace(/[\.\#\$\[\]\/]/g, "").trim();
            
            if (safeNewKey !== oldKey) {
                await fetch(`${firebaseUrlBase}/${encodeURIComponent(safeNewKey)}.json?auth=${secret}`, {
                    method: 'PUT',
                    body: JSON.stringify(updatedData)
                });
                await fetch(`${firebaseUrlBase}/${encodeURIComponent(oldKey)}.json?auth=${secret}`, {
                    method: 'DELETE'
                });
            } else {
                await fetch(`${firebaseUrlBase}/${encodeURIComponent(oldKey)}.json?auth=${secret}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ link: newLink, date: newDate, spkdate: newDate })
                });
            }

            fetchDatabase();
        } catch (error) {
            alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>

</body>
</html>
